name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate the app icon from docs/assets/icon.png
        run: npx @capacitor/assets generate --android --assetPath docs/assets

      - name: Let Android see the apps TANDA can open
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          x = p.read_text()
          if '<queries>' in x:
              print('queries already present'); raise SystemExit
          schemes = ['fb-messenger','fb','vnd.youtube','gcash','viber','whatsapp',
                     'googlegmail','geo','tiktok','shopeeph','lazada','tel','https']
          block = '  <queries>\n' + ''.join(
              '    <intent><action android:name="android.intent.action.VIEW" />'
              '<data android:scheme="%s" /></intent>\n' % s for s in schemes
          ) + '  </queries>\n'
          x = x.replace('</manifest>', block + '</manifest>')
          p.write_text(x)
          print('added queries for', len(schemes), 'schemes')
          PY

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename the APK to something readable
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/TANDA.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: TANDA
          path: android/app/build/outputs/apk/debug/TANDA.apk
          if-no-files-found: error