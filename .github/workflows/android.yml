name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate the app icon from docs/assets/icon.png
        run: npx @capacitor/assets generate --android --assetPath docs/assets

      - name: Add the native plugin and manifest entries
        run: |
          python3 - <<'PY'
          import pathlib, re

          pkg_dir = pathlib.Path('android/app/src/main/java/ph/tanda/app')
          pkg_dir.mkdir(parents=True, exist_ok=True)
          plugin = pathlib.Path('tools/TandaSys.java')
          (pkg_dir / 'TandaSys.java').write_text(plugin.read_text())
          print('wrote TandaSys.java')

          main = pkg_dir / 'MainActivity.java'
          m = main.read_text()
          if 'TandaSys.class' not in m:
              if 'onCreate' in m:
                  m = re.sub(r'(super\.onCreate\([^)]*\);)',
                             r'\1\n        registerPlugin(TandaSys.class);', m, count=1)
              else:
                  m = m.replace(
                      'public class MainActivity extends BridgeActivity {',
                      'public class MainActivity extends BridgeActivity {\n'
                      '    @Override\n'
                      '    public void onCreate(android.os.Bundle savedInstanceState) {\n'
                      '        registerPlugin(TandaSys.class);\n'
                      '        super.onCreate(savedInstanceState);\n'
                      '    }\n', 1)
              main.write_text(m)
              print('registered TandaSys in MainActivity')

          mf = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          x = mf.read_text()

          if '<queries>' not in x:
              packages = [
                'com.facebook.orca','com.facebook.katana','com.facebook.lite',
                'com.google.android.youtube','com.globe.gcash.android',
                'com.viber.voip','com.whatsapp','com.google.android.gm',
                'com.google.android.apps.maps','com.zhiliaoapp.musically',
                'com.shopee.ph','com.lazada.android','com.google.android.dialer',
                'com.android.dialer','com.google.android.GoogleCamera',
                'com.android.camera','com.android.camera2','com.google.android.deskclock',
                'com.android.settings','com.google.android.apps.photos','com.android.chrome',
              ]
              block = '  <queries>\n'
              for p in packages:
                  block += '    <package android:name="%s" />\n' % p
              block += ('    <intent><action android:name="android.intent.action.VIEW" />'
                        '<data android:scheme="https" /></intent>\n')
              block += ('    <intent><action android:name="android.intent.action.VIEW" />'
                        '<data android:scheme="tel" /></intent>\n')
              block += ('    <intent><action android:name="android.intent.action.MAIN" />'
                        '</intent>\n')
              block += '  </queries>\n'
              x = x.replace('</manifest>', block + '</manifest>')
              print('added queries')

          if 'WRITE_SETTINGS' not in x:
              x = x.replace('</manifest>',
                '  <uses-permission android:name="android.permission.WRITE_SETTINGS" '
                'tools:ignore="ProtectedPermissions" />\n</manifest>')
              if 'xmlns:tools' not in x:
                  x = x.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
              print('added WRITE_SETTINGS')

          mf.write_text(x)
          PY

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename the APK to something readable
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/TANDA.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: TANDA
          path: android/app/build/outputs/apk/debug/TANDA.apk
          if-no-files-found: error